plugins { id 'com.android.application' }

android {
    namespace 'id.mkoyeh.iminvent'
    compileSdk 35

    defaultConfig {
        applicationId 'id.mkoyeh.iminvent'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '0.8.1-rc13.6-androidx-fix'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
// Required at runtime by JourneyApps CaptureActivity / CaptureManager.
// Do not remove: missing ContextCompat caused scanner crashes on Android 16.
implementation 'androidx.core:core:1.13.1'
implementation 'androidx.fragment:fragment:1.6.2'
}
